services:
  api:
    build: .
    container_name: jeddah-library-api
    command: python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  dashboard:
    build: .
    container_name: jeddah-library-dashboard
    command: python -m streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      - api

  mlflow:
    build: .
    container_name: jeddah-library-mlflow
    command: python -m mlflow ui --backend-store-uri sqlite:////app/mlflow.db --default-artifact-root /app/mlartifacts --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./:/app